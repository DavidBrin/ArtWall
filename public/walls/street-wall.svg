<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d5ce"/>
      <stop offset="1" stop-color="#b9b4ac"/>
    </linearGradient>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" filter="url(#noise)"/>
  <g stroke="#9f9a91" stroke-opacity="0.35" stroke-width="3">
    <path d="M0 160 H1600"/><path d="M0 330 H1600"/><path d="M0 520 H1600"/><path d="M0 710 H1600"/>
    <path d="M280 0 V1000"/><path d="M620 0 V1000"/><path d="M980 0 V1000"/><path d="M1320 0 V1000"/>
  </g>
</svg>
