<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="chalk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5a49"/>
      <stop offset="1" stop-color="#1f3d33"/>
    </linearGradient>
    <filter id="dust" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#chalk)"/>
  <rect width="1600" height="1000" filter="url(#dust)"/>
  <g stroke="#dfe8e3" stroke-opacity="0.12" stroke-width="2">
    <path d="M0 250H1600"/><path d="M0 500H1600"/><path d="M0 750H1600"/>
  </g>
</svg>
